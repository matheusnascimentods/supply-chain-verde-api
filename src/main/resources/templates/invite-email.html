<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convite para o Supply Chain Verde</title>
</head>
<!-- Estilo do card de login do supply-chain-verde-web, em tabelas e estilos inline (clientes de email ignoram CSS externo). -->
<!-- Lido com String.formatted: 1 = companhia, 2 = perfil, 3 = link; "%%" literal vira "%%%%". O logo vem como anexo inline (cid:logo). -->
<body style="margin:0;padding:0;background-color:#f8f9fb;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f8f9fb;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%%" cellpadding="0" cellspacing="0" border="0" style="max-width:570px;background-color:#ffffff;border:1px solid #f1f5f9;border-radius:16px;box-shadow:0 8px 22px rgba(15,23,42,0.08);">
        <tr>
          <td style="padding:40px 40px 32px 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
              <tr>
                <td style="padding-right:8px;vertical-align:middle;"><img src="cid:logo" width="32" height="32" alt="" style="display:block;border:0;border-radius:6px;"></td>
                <td style="vertical-align:middle;font-size:16px;font-weight:700;letter-spacing:-0.01em;color:#0f172a;">Supply Chain Verde</td>
              </tr>
            </table>
            <h1 style="margin:28px 0 0 0;text-align:center;font-size:24px;line-height:32px;font-weight:700;letter-spacing:-0.02em;color:#0f172a;">Você foi convidado</h1>
            <p style="margin:16px 0 0 0;text-align:center;font-size:14px;line-height:22px;color:#64748b;">
              Entre na <strong style="color:#0f172a;">%1$s</strong> no Supply Chain Verde com o perfil <strong style="color:#0f172a;">%2$s</strong>.
            </p>
            <table role="presentation" width="100%%" cellpadding="0" cellspacing="0" border="0" style="margin-top:28px;">
              <tr>
                <td align="center" style="border-radius:8px;background-color:#16a34a;">
                  <a href="%3$s" style="display:block;padding:11px 16px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">Aceitar convite</a>
                </td>
              </tr>
            </table>
            <p style="margin:24px 0 0 0;text-align:center;font-size:12px;line-height:18px;color:#64748b;">
              O link vale por 24 horas e só pode ser usado uma vez. Se não esperava este convite, ignore este email.
            </p>
            <p style="margin:16px 0 0 0;padding-top:16px;border-top:1px solid #f1f5f9;text-align:center;font-size:12px;line-height:18px;color:#94a3b8;word-break:break-all;">
              Se o botão não funcionar, copie e cole no navegador:<br>
              <a href="%3$s" style="color:#15803d;">%3$s</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
