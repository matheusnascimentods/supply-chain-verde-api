spring.application.name=supply-chain-verde-api

# Server
server.port=${SERVER_PORT:8080}

# Datasource MySQL: a API conecta com supply_app, que só lê audit_log (docker/mysql/init e V6)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/supply_chain_verde?connectionTimeZone=SERVER}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:supply_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:supply_app}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# O MySQLDialect limita os joins a 2 níveis e corta os @EntityGraph mais fundos
# (transport → chain → batch → supplier → address); o PostgreSQLDialect não tinha limite.
spring.jpa.properties.hibernate.max_fetch_depth=5

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# Migrations criam triggers com DEFINER supply_audit e dão grants: precisam de admin
spring.flyway.user=${FLYWAY_USER:root}
spring.flyway.password=${FLYWAY_PASSWORD:root}
spring.flyway.placeholders.app_user=${SPRING_DATASOURCE_USERNAME:supply_app}

# Security / JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
