spring.application.name=supply-chain-verde-api
# Lê o .env da raiz no spring-boot:run (RN-11). No container e no CI não há .env, e as variáveis vêm do ambiente.
spring.config.import=optional:file:.env[.properties]

# Server
server.port=${SERVER_PORT:8080}
# Atrás do proxy (Caddy) os links gerados saem com o esquema e o host públicos
server.forward-headers-strategy=framework

# Datasource MySQL: a API conecta com supply_app, que só lê audit_log (docker/mysql/init e V6)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/supply_chain_verde?connectionTimeZone=SERVER}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:supply_app}
spring.datasource.password=${MYSQL_APP_PASSWORD:supply_app}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# O MySQLDialect limita os joins a 2 níveis e corta os @EntityGraph mais fundos
# (transport → chain → batch → supplier → address); o PostgreSQLDialect não tinha limite.
spring.jpa.properties.hibernate.max_fetch_depth=5

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# Migrations criam triggers com DEFINER supply_audit e dão grants: precisam de admin
spring.flyway.user=${FLYWAY_USER:root}
spring.flyway.password=${MYSQL_ROOT_PASSWORD:root}
spring.flyway.placeholders.app_user=${SPRING_DATASOURCE_USERNAME:supply_app}

# Security / JWT
# Obrigatória, sem default: a API não sobe sem ela.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Rate limit (feature 013): ligado em qualquer ambiente; só a configuração de testes desliga.
rate-limit.enabled=true

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Convites (feature 011): obrigatórias, sem default. A API não sobe sem elas.
# SENDGRID_FROM precisa ser um remetente verificado no SendGrid. O link do convite usa APP_FRONTEND_URL ou, sem ela,
# https://<SITE_ADDRESS>.
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from=${SENDGRID_FROM}
app.frontend-url=${APP_FRONTEND_URL:https://${SITE_ADDRESS}}
