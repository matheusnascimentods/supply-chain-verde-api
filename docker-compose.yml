services:
  postgres:
    image: postgres:17-alpine
    container_name: supply-chain-verde-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: supply_chain_verde
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supply_chain_verde"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
