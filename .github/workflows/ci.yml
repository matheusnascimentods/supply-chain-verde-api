name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw --batch-mode --update-snapshots verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  # Só na main e depois dos testes (RN-10). A tag sha permite voltar de versão sem rebuild.
  publish:
    name: Publish image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Atualiza a VM pelo SSM: nenhuma porta aberta, e a chave do usuário github-deploy só manda comando para esta instância.
  deploy:
    name: Deploy
    needs: publish
    runs-on: ubuntu-latest
    env:
      INSTANCE_ID: i-01e94649d8a12418c
      SERVICE: api

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # O SSM roda como root; o repositório na VM é do ubuntu, que também está no grupo docker.
      - name: Update the VM
        run: |
          cmd="runuser -u ubuntu -- bash -c 'cd /home/ubuntu/supply-chain-verde-api && git pull -q && docker compose pull $SERVICE && docker compose up -d $SERVICE'"
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "$GITHUB_REPOSITORY@${GITHUB_SHA::7}" \
            --parameters "$(jq -n --arg c "$cmd" '{commands: [$c]}')" \
            --query Command.CommandId --output text)

          # O waiter do CLI desiste em 100 s; o pull da imagem pode passar disso.
          for _ in $(seq 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          test "$status" = Success
